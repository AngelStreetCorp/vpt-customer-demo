# Customer overlay configuration — read by setup/proxmox/node/deploy_customer.sh (public repo).
# Keep this file free of secrets and internal addresses; it is meant to be publishable.

# Public VirtualPyTest git ref to deploy (a release tag in production, e.g. main-2026.09.02-8549).
PIN=main

# Optional features NOT deployed to this customer (deny-list; empty = everything).
# Known features: avq, quicktest, ai-test, virtual-scripts
DISABLED_FEATURES=

# Deploy targets, role:alias — set in customer.local.conf (git-ignored) or pass --targets.
TARGETS=
